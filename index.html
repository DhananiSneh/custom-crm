<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom CRM</title>
  <meta name="description" content="A small CRM. Clients move through Hello, Fit, Build, and Kept. Records stay in this browser.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="mark" href="./">Custom CRM</a>
    <a class="ghost" href="https://github.com/DhananiSneh/custom-crm">Source</a>
  </header>
  <main>
    <form id="new-client">
      <input name="name" required maxlength="80" placeholder="Client name" aria-label="Client name">
      <input name="note" maxlength="180" placeholder="What they need" aria-label="Note">
      <button type="submit">Add client</button>
    </form>
    <div class="desk">
      <div id="list"></div>
      <article id="detail" hidden>
        <p class="kicker">Client</p>
        <h1 id="who"></h1>
        <p id="note"></p>
        <div id="stages" class="stages"></div>
        <button type="button" id="remove" class="quiet">Remove</button>
      </article>
      <p id="empty">Add a client to open the desk.</p>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
